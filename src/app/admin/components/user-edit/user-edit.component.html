<div class="user-edit-container">
  <!-- Header -->
  <div class="edit-header">
    <button mat-icon-button (click)="cancel()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h1 class="page-title">Edit User</h1>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-container">
    <mat-spinner diameter="40"></mat-spinner>
    <p>Loading user data...</p>
  </div>

  <!-- Edit Form -->
  <div *ngIf="!isLoading && user" class="edit-content">
    <mat-card class="edit-card">
      <mat-card-header>
        <mat-card-title>
          <mat-icon>edit</mat-icon>
          Edit User: {{ user.email }}
        </mat-card-title>
        <mat-card-subtitle>Update user information and permissions</mat-card-subtitle>
      </mat-card-header>

      <mat-card-content>
        <form class="edit-form">
          <!-- Email Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput
                   type="email"
                   [(ngModel)]="user.email"
                   name="email"
                   placeholder="Enter user email">
          </mat-form-field>

          <!-- Role Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Role</mat-label>
            <mat-select [(ngModel)]="user.role" name="role">
              <mat-option value="user">User</mat-option>
              <mat-option value="admin">Admin</mat-option>
            </mat-select>
          </mat-form-field>

          <!-- Status Field -->
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Status</mat-label>
            <mat-select [(ngModel)]="user.is_active" name="is_active">
              <mat-option [value]="true">Active</mat-option>
              <mat-option [value]="false">Inactive</mat-option>
            </mat-select>
          </mat-form-field>

          <!-- User Information (Read-only) -->
          <div class="info-section">
            <h3>Account Information</h3>
            <div class="info-grid">
              <div class="info-item">
                <label>User ID:</label>
                <span>{{ user.id }}</span>
              </div>
              <div class="info-item">
                <label>Created:</label>
                <span>{{ formatDate(user.created_at) }}</span>
              </div>
              <div class="info-item" *ngIf="user.last_login">
                <label>Last Login:</label>
                <span>{{ formatDate(user.last_login) }}</span>
              </div>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="form-actions">
            <button mat-stroked-button type="button" (click)="cancel()">
              <mat-icon>cancel</mat-icon>
              Cancel
            </button>
            <button mat-raised-button
                    color="primary"
                    type="button"
                    (click)="saveUser()"
                    [disabled]="isLoading">
              <mat-icon>save</mat-icon>
              Save Changes
            </button>
          </div>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
</div>
